<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standalone components: Apple Pay in cross-domain iframe</title>
    <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../styles.css" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <div id="page-content" class="page-content">
        <div class="back-link">
            <a href="../../../">← flow samples</a>
        </div>

        <div class="container">
            <h1>Standalone components: Apple Pay in cross-domain iframe</h1>
            <p>Apple Pay component with <code>initiativeContext</code> set to the parent page domain</p>

            <iframe id="applepay-iframe" title="Apple Pay iframe" class="applepay-iframe" allow="payment *"></iframe>

            <p id="config-message" class="config-message hidden">Set <code>APPLE_PAY_URL</code> in <code>.env</code> to
                the page you want to load in the iframe.</p>
        </div>
    </div>

    <script src="../../../themes.js"></script>
    <script src="app.js"></script>
</body>

</html>
